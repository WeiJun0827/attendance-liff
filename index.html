<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>打卡</title>
<style>
  body { font-family: -apple-system, "Noto Sans TC", sans-serif; margin: 0;
         display: flex; align-items: center; justify-content: center;
         min-height: 100vh; background: #f6f7f9; }
  .card { background: #fff; border-radius: 16px; padding: 32px 24px; width: 88%;
          max-width: 360px; text-align: center; box-shadow: 0 2px 12px rgba(0,0,0,.08); }
  .big { font-size: 22px; font-weight: 700; margin: 12px 0; }
  .sub { color: #666; font-size: 15px; line-height: 1.6; }
  .err { color: #c0392b; }
  .warn { color: #b9570a; font-size: 15px; line-height: 1.6; margin-top: 16px;
          padding-top: 16px; border-top: 1px solid #eee; white-space: pre-line; }
  #go { margin-top: 20px; width: 100%; padding: 16px; border: 0; border-radius: 12px;
        background: #06c755; color: #fff; font-size: 20px; font-weight: 700; }
</style>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>
<body>
<div class="card">
  <div id="icon" style="font-size:40px">⏳</div>
  <div class="big" id="title">處理中…</div>
  <div class="sub" id="detail"></div>
  <button type="button" id="go" hidden></button>
  <div class="warn" id="notice" hidden></div>
</div>
<script>
  // Served from a static host, not Apps Script: inside HtmlService's iframe
  // liff.init() never resolves (docs/2026-08-23-代打防偽調查.md).
  var LIFF_ID = '2011210214-NWcJccll';
  var EXEC_URL = 'https://script.google.com/macros/s/AKfycby-4L498wOTRUCyy2BfTlqQzWgDZmXmgWgZ3URVwIJgYJey5CiJpzWvqjo4jtILVJjk/exec';
  var T0 = performance.now();
  var IP_MS = null;
  var GPS_MS = null;

  // The rich menu opens liff.line.me/<id>?kind=上班 or ?view=statement. LINE
  // first hands the query over inside liff.state, then liff.init() reloads with
  // it in place.
  function fromUrl(name) {
    var p = new URLSearchParams(location.search);
    var state = p.get('liff.state');
    return p.get(name) || (state ? new URLSearchParams(state.replace(/^[^?]*\?/, '')).get(name) : null);
  }
  var KIND = fromUrl('kind');
  var VIEW = fromUrl('view');
  var FALLBACK = '請在聊天室輸入「' + (KIND || '上班') + '」，改用連結打卡。';

  function render(icon, title, detail, isErr) {
    document.getElementById('icon').textContent = icon;
    document.getElementById('title').textContent = title;
    var d = document.getElementById('detail');
    d.textContent = detail;
    d.className = isErr ? 'sub err' : 'sub';
  }

  // Every wait has its own timeout: a promise that never settles would leave
  // the person on 處理中… with no way to punch.
  function within(ms, p) {
    return Promise.race([p, new Promise(function (_, reject) {
      setTimeout(function () { reject(new Error('timeout')); }, ms);
    })]);
  }

  // text/plain keeps this a simple request, so there is no CORS preflight,
  // which Apps Script cannot answer.
  function post(body) {
    return within(30000, fetch(EXEC_URL, { method: 'POST', body: JSON.stringify(body) })
      .then(function (r) { return r.json(); }));
  }

  function locate() {
    if (!navigator.geolocation) return Promise.resolve(null);
    var g0 = performance.now();
    return new Promise(function (resolve) {
      var done = function (pos) { GPS_MS = Math.round(performance.now() - g0); resolve(pos); };
      navigator.geolocation.getCurrentPosition(done, function () { done(null); },
        { enableHighAccuracy: true, timeout: 8000, maximumAge: 60000 });
    });
  }

  function showNotice(idToken) {
    post({ type: 'liffNotice', idToken: idToken }).then(function (r) {
      if (!r.notice) return;
      var n = document.getElementById('notice');
      n.textContent = '⚠️ ' + r.notice;
      n.hidden = false;
    }).catch(function () {});
  }

  function egressIp() {
    return within(3000, fetch('https://api.ipify.org?format=json').then(function (r) { return r.json(); }))
      .then(function (j) { IP_MS = Math.round(performance.now() - T0); return j.ip || ''; })
      .catch(function () { return ''; });
  }

  // A mis-tapped menu button must write nothing, so the punch waits for this
  // tap. Identity and IP are fetched meanwhile, so the tap costs one request.
  var EMOJI = {
    '早上班': '🌅', '午上班': '🏙️', '晚上班': '🌃',
    '早下班': '🍱', '午下班': '☕', '晚下班': '🏠'
  };

  function confirmTap(session) {
    var hm = new Date().toTimeString().slice(0, 5);
    render(EMOJI[session + KIND] || '⏰', '確認' + (session ? session + '診' : '') + KIND + '打卡？',
      '現在時間 ' + hm, false);
    var go = document.getElementById('go');
    go.textContent = KIND + '打卡';
    go.hidden = false;
    return new Promise(function (resolve) {
      go.onclick = function () {
        go.hidden = true;
        render('⏳', '處理中…', '', false);
        resolve();
      };
    });
  }

  // While this page is still parsing, document.open() is ignored and write()
  // inserts into it instead of replacing it.
  function replacePage(html, then) {
    var go = function () {
      document.open();
      document.write(html);
      document.close();
      then();
    };
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', go);
    else go();
  }

  // The server returns the same page the ?key= link serves, whole; writing it
  // over this one runs its own script, so the two never drift apart.
  function openStatement() {
    var failed = '請在聊天室輸入「查詢出勤」，改用連結查詢。';
    document.title = '出勤紀錄';
    render('⏳', '載入中…', '', false);
    within(10000, liff.init({ liffId: LIFF_ID }))
      .then(function () {
        if (!liff.isLoggedIn()) { liff.login({ redirectUri: location.href }); return; }
        var idToken = liff.getIDToken();
        if (!idToken) throw new Error('no id token');
        return post({ type: 'liffStatement', idToken: idToken }).then(function (r) {
          if (!r.ok) { render('⚠️', r.message, '', true); return; }
          replacePage(r.html, function () { addCorrectionForm(idToken); });
        });
      })
      .catch(function () { render('⚠️', '無法載入出勤紀錄', failed, true); });
  }

  // LIFF only: the ?key= page has no LINE identity to file a 補簽 under. The
  // server files it for the token's owner, whichever person is on screen.
  var SHEET_CSS = '#fixbtn{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:1;'
    + 'border:0;border-radius:999px;padding:13px 20px;background:#06c755;color:#fff;font-size:16px;font-weight:700;'
    + 'box-shadow:0 2px 12px rgba(0,0,0,.2)}'
    + '#fixsheet{position:fixed;inset:0;z-index:3;background:rgba(0,0,0,.35);display:flex;align-items:flex-end}'
    + '#fixsheet[hidden]{display:none}'
    + '#fixsheet form{background:#fff;width:100%;max-width:560px;margin:0 auto;border-radius:16px 16px 0 0;'
    + 'padding:20px 16px calc(20px + env(safe-area-inset-bottom));box-sizing:border-box}'
    + '#fixsheet h2{font-size:18px;margin:0 0 14px}'
    + '#fixsheet label{display:block;font-size:14px;color:#666;margin:12px 0 6px}'
    + '#fixsheet input[type=date],#fixsheet input[type=time],#fixsheet input[type=text]{width:100%;box-sizing:border-box;'
    + 'font-size:16px;padding:10px;border:1px solid #d8dbe0;border-radius:10px}'
    + '#fixsheet #fixap{color:#06c755;margin-left:6px}'
    + '#fixsheet .kind{display:flex;gap:8px}'
    + '#fixsheet .kind label{flex:1;margin:0;text-align:center;border:1px solid #d8dbe0;border-radius:10px;padding:10px;color:#222;font-size:16px}'
    + '#fixsheet .kind input{margin-right:6px}'
    + '#fixsheet .msg{font-size:14px;line-height:1.6;margin-top:14px;white-space:pre-line}'
    + '#fixsheet .msg.err{color:#c0392b}'
    + '#fixsheet .row{display:flex;gap:8px;margin-top:16px}'
    + '#fixsheet .row button{flex:1;font-size:16px;padding:13px;border-radius:12px;border:1px solid #d8dbe0;background:#f6f7f9}'
    + '#fixsheet .row button[type=submit]{border:0;background:#06c755;color:#fff;font-weight:700}';

  function ymd(d) {
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }

  function addCorrectionForm(idToken) {
    var style = document.createElement('style');
    style.textContent = SHEET_CSS;
    document.head.appendChild(style);

    var btn = document.createElement('button');
    btn.type = 'button';
    btn.id = 'fixbtn';
    btn.textContent = '申請補簽';
    document.body.appendChild(btn);

    var sheet = document.createElement('div');
    sheet.id = 'fixsheet';
    sheet.hidden = true;
    sheet.innerHTML = '<form><h2>申請補簽</h2>'
      + '<label for="fixdate">日期</label><input type="date" id="fixdate" required>'
      + '<label for="fixtime">時間 <b id="fixap"></b></label><input type="time" id="fixtime" required>'
      + '<label>上班或下班</label><div class="kind">'
      + '<label><input type="radio" name="fixkind" value="上班" required>上班</label>'
      + '<label><input type="radio" name="fixkind" value="下班">下班</label></div>'
      + '<label for="fixreason">事由</label><input type="text" id="fixreason" maxlength="100" required placeholder="例：忘記打卡">'
      + '<div class="msg" id="fixmsg">送出後要等管理員審核，才會計入出勤。</div>'
      + '<div class="row"><button type="button" id="fixcancel">取消</button>'
      + '<button type="submit" id="fixsend">送出</button></div></form>';
    document.body.appendChild(sheet);

    var form = sheet.querySelector('form');
    var date = document.getElementById('fixdate');
    var msg = document.getElementById('fixmsg');
    var send = document.getElementById('fixsend');
    var now = new Date();
    // This month and last month only: the server refuses anything older.
    date.min = ymd(new Date(now.getFullYear(), now.getMonth() - 1, 1));
    date.max = ymd(now);

    // The control shows the phone's own 12/24-hour style; this names the half of the day either way.
    var tm = document.getElementById('fixtime');
    function ampm() {
      var h = parseInt(tm.value, 10);
      document.getElementById('fixap').textContent = isNaN(h) ? '' : h < 12 ? '上午' : '下午';
    }
    tm.addEventListener('input', ampm);
    tm.addEventListener('change', ampm);

    function say(text, isErr) {
      msg.textContent = text;
      msg.className = isErr ? 'msg err' : 'msg';
    }

    function open(fix) {
      if (fix) {
        date.value = fix.getAttribute('data-fix-date');
        tm.value = fix.getAttribute('data-fix-time');
        ampm();
        form.querySelector('input[name=fixkind][value=' + fix.getAttribute('data-fix-kind') + ']').checked = true;
      } else if (!date.value) date.value = ymd(new Date());
      say('送出後要等管理員審核，才會計入出勤。', false);
      sheet.hidden = false;
    }
    btn.onclick = function () { open(null); };
    // Capture phase, so a ？ opens the form and its own onclick never shows the note.
    document.addEventListener('click', function (e) {
      var fix = e.target.closest && e.target.closest('[data-fix-kind]');
      if (!fix) return;
      e.stopPropagation();
      open(fix);
    }, true);
    document.getElementById('fixcancel').onclick = function () { sheet.hidden = true; };
    form.onsubmit = function (e) {
      e.preventDefault();
      var kind = form.querySelector('input[name=fixkind]:checked');
      send.disabled = true;
      say('送出中…', false);
      post({
        type: 'liffCorrection', idToken: liff.getIDToken() || idToken,
        date: date.value, time: document.getElementById('fixtime').value,
        kind: kind ? kind.value : '', reason: document.getElementById('fixreason').value
      }).then(function (r) {
        say(r.message, !r.ok);
        if (r.ok) { form.reset(); ampm(); }
      }).catch(function () {
        say('補簽沒有送出成功，請在聊天室輸入「/補簽」改用指令申請。', true);
      }).then(function () { send.disabled = false; });
    };
  }

  if (VIEW === 'statement') openStatement();
  else if (KIND !== '上班' && KIND !== '下班') render('⚠️', '無法完成打卡', FALLBACK, true);
  else Promise.all([within(10000, liff.init({ liffId: LIFF_ID })), egressIp()])
    .then(function (got) {
      if (!liff.isLoggedIn()) { liff.login({ redirectUri: location.href }); return null; }
      var idToken = liff.getIDToken();
      if (!idToken) throw new Error('no id token');
      var req = { type: 'liffPrepare', idToken: idToken, kind: KIND, ip: got[1],
                  lat: null, lng: null, acc: null, ipMs: IP_MS, gpsMs: null, gpsTried: true };
      // Identity, the window and duplicate checks, and GPS are all settled
      // here, before the button shows, so the tap waits only for the write.
      return post(req).then(function (p) {
        if (!p.ok) { render('⚠️', p.message, '', true); return null; }
        req.type = 'liffPunch';
        req.ticket = p.ticket;
        var located = !p.needLocation ? Promise.resolve() : locate().then(function (pos) {
          req.gpsMs = GPS_MS;
          if (pos) {
            req.lat = pos.coords.latitude;
            req.lng = pos.coords.longitude;
            req.acc = Math.round(pos.coords.accuracy);
          }
        });
        return located.then(function () { return confirmTap(p.session || ''); })
          .then(function () { return post(req); });
      }).then(function (r) {
        if (r === null) return;
        if (!r.ok) { render('⚠️', r.message, '', true); return; }
        render('✅', r.message, '', false);
        showNotice(idToken);
      });
    })
    .catch(function () { render('⚠️', '無法完成打卡', FALLBACK, true); });
</script>
</body>
</html>
